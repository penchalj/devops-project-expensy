apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: expensy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 686699774218.dkr.ecr.us-east-1.amazonaws.com/penchal-expensy-backend:latest
          ports:
            - containerPort: 8706
          env:
            - name: PORT
              value: "8706"
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: expensy-secrets
                  key: DATABASE_URI
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expensy-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8706
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: expensy
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8706
      targetPort: 8706
